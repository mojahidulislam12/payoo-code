<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payoo | Home</title>
    <link rel="shortcut icon" href="assets/logo.png" type="image/x-icon">
    <!-- Tailwind + Daisy -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&family=Outfit:wght@100..900&display=swap"
        rel="stylesheet">
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <style>
        * {
            font-family: "Manrope", sans-serif;
        }
    </style>
</head>

<body class="min-h-screen max-w-md bg-base-200 mx-auto pt-11">
    <header class="border-b-2 border-gray-300 pl-[22px] pr-[22px] sticky top-0 bg-base-200 z-10">
        <section class="w-12/12 mx-auto py-3 flex justify-between items-center">
            <div class="left flex gap-2">
                <div class="log w-[60px]">
                    <img src="assets/logo.png" alt="" srcset="">
                </div>
                <div class="balance-info">
                    <h2 class="text-2xl font-bold">$ <span id="balance">45000</span></h2>
                    <p class="font-normal text-[14px] opacity-50">Available Balance</p>
                </div>
            </div>
            <div class="right">
                <a href="index.html" class="btn btn-soft"><i class="fa-solid fa-arrow-right-from-bracket"></i>Log
                    Out</a>
            </div>
        </section>
    </header>

    <section class="w-11/12 mx-auto py-[39px] space-y-5">
        <h1 class="font-bold text-[24px]">Welcome to Pay<span class="text-primary">oo</span></h1>
        <p class="font-normal text-[14px] opacity-50">Enjoy easy and convenient financial services with us. Cashout
            charge is low and </p>

        <div class="buttons grid grid-cols-3 gap-[16.5px]">
            <button class="btn flex-col w-[123px] h-[90px] rounded-md py-[20px] btn-soft">
                <img src="assets/opt-1.png" alt="">
                <p>Add Money</p>
            </button>
            <button class="btn flex-col w-[123px] h-[90px] rounded-md py-[20px] btn-soft">
                <img src="assets/opt-2.png" alt="">
                <p>Cashout</p>
            </button>
            <button class="btn flex-col w-[123px] h-[90px] rounded-md py-[20px] btn-soft">
                <img src="assets/opt-3.png" alt="">
                <p>Transfer Money</p>
            </button>
            <button class="btn flex-col w-[123px] h-[90px] rounded-md py-[20px] btn-soft">
                <img src="assets/opt-4.png" alt="">
                <p>Get Bonus</p>
            </button>
            <button class="btn flex-col w-[123px] h-[90px] rounded-md py-[20px] btn-soft">
                <img src="assets/opt-5.png" alt="">
                <p>Pay Bill</p>
            </button>
            <button class="btn flex-col w-[123px] h-[90px] rounded-md py-[20px] btn-soft">
                <img src="assets/opt-6.png" alt="">
                <p>Transactions</p>
            </button>


        </div>
    </section>

    <section id="cashout" class="w-11/12 mx-auto py-5">
        <h1 class="text-xl font-bold mb-5">Cashout</h1>
        <div class="card bg-base-100 w-full  shadow  rounded-2xl">
            <div class="card-body">
                <fieldset class="fieldset">
                    <label class="label font-medium text-[16px]">Agent Number</label>
                    <input type="number" id="cashout-number" class="input rounded-full w-full bg-[#F4F5F7]"
                        maxlength="11" minlength="11" placeholder="Enter 11 digit number" />
                    <label class="label font-medium text-[16px]">Amount</label>
                    <input type="number" id="cashout-amount" class="input rounded-full w-full bg-[#F4F5F7]"
                        placeholder="Enter amount to withdraw" />

                    <label class="label font-medium text-[16px]">4 Digit Pin</label>
                    <input type="password" id="cashout-pin" class="input rounded-full w-full bg-[#F4F5F7]" maxlength="4"
                        minlength="4" placeholder="Enter 4 Digit Pin" />

                    <button id="cashout-btn"
                        class="btn btn-neutral font-semibold text-[20px] mt-4 bg-[#3B25C1] text-[#FFFFFF] rounded-full">Withdraw
                        Money</button>
                </fieldset>
            </div>
        </div>

    </section>

    <script src="js/cashout.js"></script>
</body>

</html>
